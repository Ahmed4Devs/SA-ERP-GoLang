version: "2"
sql:
  - engine: "postgresql"
    schema: "database/migrations"
    queries:
      - "database/queries/platform"
      - "database/queries/ref"
      - "database/queries/iam"
      - "database/queries/organization"
      - "database/queries/authorization"
      - "database/queries/audit"
      - "database/queries/workflow"
      - "database/queries/accounting"
      - "database/queries/tax"
      - "database/queries/products"
      - "database/queries/inventory"
      - "database/queries/receivables"
      - "database/queries/sales"
      - "database/queries/payables"
      - "database/queries/purchasing"
      - "database/queries/treasury"
      - "database/queries/banking"
      - "database/queries/hr"
      - "database/queries/attendance"
      - "database/queries/leave"
      - "database/queries/payroll"
      - "database/queries/gosi"
      - "database/queries/fixedassets"
      - "database/queries/budgeting"
      - "database/queries/zatca"
      - "database/queries/reporting"
    gen:
      go:
        package: "sqlc"
        out: "internal/platform/database/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: true
        emit_empty_slices: true
