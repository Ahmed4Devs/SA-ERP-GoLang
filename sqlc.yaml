version: "2"
sql:
  - engine: "postgresql"
    schema: "database/migrations"
    queries:
      - "database/queries/platform"
      - "database/queries/ref"
      - "database/queries/iam"
      - "database/queries/organization"
      - "database/queries/authorization"
      - "database/queries/audit"
      - "database/queries/workflow"
      - "database/queries/accounting"
      - "database/queries/tax"
      - "database/queries/products"
    gen:
      go:
        package: "sqlc"
        out: "internal/platform/database/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: true
        emit_empty_slices: true
