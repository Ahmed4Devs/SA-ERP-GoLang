version: "2"
sql:
  - schema: "database/migrations"
    queries: "database/queries"
    gen:
      go:
        package: "db"
        out: "internal/platform/database/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: true
        emit_empty_slices: true
