global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: erp-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/erp_metrics_token
    static_configs:
      - targets: ['erp-api:8080']
  - job_name: erp-backup
    static_configs:
      - targets: ['erp-backup-metrics:9100']
