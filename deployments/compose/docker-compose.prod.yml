services:
  # 1. Primary Relational Database (PostgreSQL 18)
  postgres:
    image: postgres:18.2-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: Asia/Riyadh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?required} -d ${POSTGRES_DB:?required}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - erp-internal

  # 2. Database Schema Migration Runner
  erp-migrate:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "${DATABASE_URL:?DATABASE_URL is required}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - erp-internal

  # 3. Go Backend Core API Service
  erp-api:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.api
    restart: always
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      DB_MAX_CONNS: "50"
      DB_MIN_CONNS: "5"
      CORS_ALLOWED_ORIGINS: "${APP_URL:?APP_URL is required}"
      TRUSTED_PROXIES: "172.16.0.0/12"
      MFA_ENCRYPTION_KEY: "${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}"
      METRICS_BEARER_TOKEN: "${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}"
      BOOTSTRAP_ADMIN_ENABLED: "false"
      BOOTSTRAP_DEMO_DATA_ENABLED: "false"
      MAIL_DRIVER: smtp
      SMTP_HOST: "${SMTP_HOST:?SMTP_HOST is required}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:?SMTP_USERNAME is required}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:?SMTP_PASSWORD is required}"
      SMTP_FROM: "${SMTP_FROM:?SMTP_FROM is required}"
      ZATCA_ENABLED: "${ZATCA_ENABLED:-false}"
      ZATCA_ENVIRONMENT: "${ZATCA_ENVIRONMENT:-simulation}"
      ZATCA_PRODUCTION_ACKNOWLEDGED: "${ZATCA_PRODUCTION_ACKNOWLEDGED:-false}"
      ZATCA_BASE_URL: "${ZATCA_BASE_URL:-https://gw-fatoora.zatca.gov.sa/e-invoicing/core}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_INSECURE: "${OTEL_EXPORTER_OTLP_INSECURE:-false}"
      OTEL_TRACES_SAMPLER_RATIO: "${OTEL_TRACES_SAMPLER_RATIO:-0.1}"
      STORAGE_LOCAL_DIR: /app/data/storage
      TZ: Asia/Riyadh
    volumes:
      - documentdata:/app/data/storage
    depends_on:
      erp-migrate:
        condition: service_completed_successfully
    networks:
      - erp-internal

  # 4. Background Asynchronous Worker
  erp-worker:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.worker
    restart: always
    profiles: ["zatca"]
    environment:
      APP_ENV: production
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      CORS_ALLOWED_ORIGINS: "${APP_URL:?APP_URL is required}"
      MFA_ENCRYPTION_KEY: "${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}"
      METRICS_BEARER_TOKEN: "${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}"
      BOOTSTRAP_ADMIN_ENABLED: "false"
      BOOTSTRAP_DEMO_DATA_ENABLED: "false"
      MAIL_DRIVER: smtp
      SMTP_HOST: "${SMTP_HOST:?required}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:?required}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:?required}"
      SMTP_FROM: "${SMTP_FROM:?required}"
      ZATCA_ENABLED: "${ZATCA_ENABLED:-false}"
      ZATCA_ENVIRONMENT: "${ZATCA_ENVIRONMENT:-simulation}"
      ZATCA_PRODUCTION_ACKNOWLEDGED: "${ZATCA_PRODUCTION_ACKNOWLEDGED:-false}"
      ZATCA_BASE_URL: "${ZATCA_BASE_URL:-https://gw-fatoora.zatca.gov.sa/e-invoicing/core}"
      TZ: Asia/Riyadh
    depends_on:
      erp-migrate:
        condition: service_completed_successfully
    networks:
      - erp-internal

  # 5. Next.js Web Frontend
  erp-web:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.web
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - erp-api
    networks:
      - erp-internal

  # 6. Production Reverse Proxy (Nginx)
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - "${TLS_CERT_PATH:?TLS_CERT_PATH is required}:/etc/nginx/ssl/erp.crt:ro"
      - "${TLS_KEY_PATH:?TLS_KEY_PATH is required}:/etc/nginx/ssl/erp.key:ro"
    depends_on:
      - erp-web
      - erp-api
    networks:
      - erp-internal
      - erp-public

networks:
  erp-internal:
    driver: bridge
  erp-public:
    driver: bridge

volumes:
  pgdata:
    name: erp-pgdata
  pgbackups:
    name: erp-pgbackups
  documentdata:
    name: erp-documentdata
