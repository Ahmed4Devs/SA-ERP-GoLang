services:
  # 1. Primary Relational Database (PostgreSQL 18)
  postgres:
    image: erp-postgres:18.6
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: Asia/Riyadh
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?required} -d ${POSTGRES_DB:?required}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - erp-internal

  # Provision distinct installation, migration, runtime, and backup identities.
  erp-provision:
    image: erp-postgres:18.6
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.postgres
    entrypoint: ["psql", "--no-psqlrc", "--file=/provision/provision-roles.sql"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      ERP_MIGRATOR_PASSWORD: ${ERP_MIGRATOR_PASSWORD:?ERP_MIGRATOR_PASSWORD is required}
      ERP_APP_PASSWORD: ${ERP_APP_PASSWORD:?ERP_APP_PASSWORD is required}
      ERP_BACKUP_PASSWORD: ${ERP_BACKUP_PASSWORD:?ERP_BACKUP_PASSWORD is required}
    volumes:
      - ../postgres:/provision:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - erp-internal

  # 2. Database Schema Migration Runner
  erp-migrate:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.migrate
    environment:
      GOOSE_DRIVER: postgres
      MIGRATION_DATABASE_URL: "${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}"
    depends_on:
      erp-provision:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - erp-internal

  erp-grants:
    image: erp-postgres:18.6
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.postgres
    entrypoint: ["psql", "--no-psqlrc", "--file=/provision/grant-runtime.sql"]
    environment:
      PGHOST: postgres
      PGUSER: erp_migrator
      PGPASSWORD: ${ERP_MIGRATOR_PASSWORD:?ERP_MIGRATOR_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - ../postgres:/provision:ro
    depends_on:
      erp-migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - erp-internal

  # 3. Go Backend Core API Service
  erp-api:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.api
    restart: always
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      DB_MAX_CONNS: "50"
      DB_MIN_CONNS: "5"
      CORS_ALLOWED_ORIGINS: "${APP_URL:?APP_URL is required}"
      TRUSTED_PROXIES: "172.16.0.0/12"
      MFA_ENCRYPTION_KEY: "${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}"
      METRICS_BEARER_TOKEN: "${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}"
      BOOTSTRAP_ADMIN_ENABLED: "${BOOTSTRAP_ADMIN_ENABLED:-false}"
      BOOTSTRAP_ADMIN_USERNAME: "${BOOTSTRAP_ADMIN_USERNAME:-admin}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BOOTSTRAP_ADMIN_NAME: "${BOOTSTRAP_ADMIN_NAME:-Administrator}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      BOOTSTRAP_DEMO_DATA_ENABLED: "false"
      MAIL_DRIVER: smtp
      SMTP_HOST: "${SMTP_HOST:?SMTP_HOST is required}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:?SMTP_USERNAME is required}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:?SMTP_PASSWORD is required}"
      SMTP_FROM: "${SMTP_FROM:?SMTP_FROM is required}"
      ZATCA_ENABLED: "${ZATCA_ENABLED:-false}"
      ZATCA_ENVIRONMENT: "${ZATCA_ENVIRONMENT:-simulation}"
      ZATCA_PRODUCTION_ACKNOWLEDGED: "${ZATCA_PRODUCTION_ACKNOWLEDGED:-false}"
      ZATCA_CREDENTIALS_ENCRYPTION_KEY: "${ZATCA_CREDENTIALS_ENCRYPTION_KEY:-}"
      ZATCA_BASE_URL: "${ZATCA_BASE_URL:-https://gw-fatoora.zatca.gov.sa/e-invoicing/core}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_INSECURE: "${OTEL_EXPORTER_OTLP_INSECURE:-false}"
      OTEL_TRACES_SAMPLER_RATIO: "${OTEL_TRACES_SAMPLER_RATIO:-0.1}"
      STORAGE_LOCAL_DIR: /app/data/storage
      TZ: Asia/Riyadh
    volumes:
      - documentdata:/app/data/storage
    depends_on:
      erp-grants:
        condition: service_completed_successfully
    networks:
      - erp-internal

  # 4. Background Asynchronous Worker
  erp-worker:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.worker
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      CORS_ALLOWED_ORIGINS: "${APP_URL:?APP_URL is required}"
      MFA_ENCRYPTION_KEY: "${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}"
      METRICS_BEARER_TOKEN: "${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}"
      BOOTSTRAP_ADMIN_ENABLED: "false"
      BOOTSTRAP_DEMO_DATA_ENABLED: "false"
      MAIL_DRIVER: smtp
      SMTP_HOST: "${SMTP_HOST:?required}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:?required}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:?required}"
      SMTP_FROM: "${SMTP_FROM:?required}"
      ZATCA_ENABLED: "${ZATCA_ENABLED:-false}"
      ZATCA_ENVIRONMENT: "${ZATCA_ENVIRONMENT:-simulation}"
      ZATCA_PRODUCTION_ACKNOWLEDGED: "${ZATCA_PRODUCTION_ACKNOWLEDGED:-false}"
      ZATCA_CREDENTIALS_ENCRYPTION_KEY: "${ZATCA_CREDENTIALS_ENCRYPTION_KEY:-}"
      ZATCA_BASE_URL: "${ZATCA_BASE_URL:-https://gw-fatoora.zatca.gov.sa/e-invoicing/core}"
      TZ: Asia/Riyadh
    depends_on:
      erp-grants:
        condition: service_completed_successfully
    networks:
      - erp-internal

  # 5. On-demand encrypted database backup job. Invoke this service from a
  # host scheduler; the "operations" profile keeps it out of normal startup.
  erp-backup:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.backup
    profiles: ["operations"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: erp_backup
      POSTGRES_PASSWORD: "${ERP_BACKUP_PASSWORD:?ERP_BACKUP_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      BACKUP_ENCRYPTION_KEY: "${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY is required}"
      RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
      BACKUP_DIR: /backups
      TZ: Asia/Riyadh
    volumes:
      - pgbackups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp-internal

  # 6. Next.js Web Frontend
  erp-web:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.web
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - erp-api
    networks:
      - erp-internal

  # 7. Production Reverse Proxy (Nginx)
  nginx:
    image: erp-nginx:1.30.0
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - "${TLS_CERT_PATH:?TLS_CERT_PATH is required}:/etc/nginx/ssl/erp.crt:ro"
      - "${TLS_KEY_PATH:?TLS_KEY_PATH is required}:/etc/nginx/ssl/erp.key:ro"
    depends_on:
      erp-web:
        condition: service_healthy
      erp-api:
        condition: service_healthy
    networks:
      - erp-internal
      - erp-public

networks:
  erp-internal:
    driver: bridge
  erp-public:
    driver: bridge

volumes:
  pgdata:
    name: erp-pgdata
  pgbackups:
    name: erp-pgbackups
  documentdata:
    name: erp-documentdata
