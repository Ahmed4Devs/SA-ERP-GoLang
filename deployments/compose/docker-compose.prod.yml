version: "3.9"

services:
  # 1. Primary Relational Database (PostgreSQL 18)
  postgres:
    image: postgres:18-alpine
    container_name: erp-postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeInProduction_StrongP@ss2026!}
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
      TZ: Asia/Riyadh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_user} -d ${POSTGRES_DB:-erp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - erp-internal

  # 2. In-Memory Cache & Queue Broker (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-RedisP@ss_Prod2026!}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisP@ss_Prod2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-internal

  # 3. Database Schema Migration Runner
  erp-migrate:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.migrate
    container_name: erp-migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "postgres://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-ChangeMeInProduction_StrongP@ss2026!}@postgres:5432/${POSTGRES_DB:-erp_db}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - erp-internal

  # 4. Go Backend Core API Service
  erp-api:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.api
    container_name: erp-api
    restart: always
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-ChangeMeInProduction_StrongP@ss2026!}@postgres:5432/${POSTGRES_DB:-erp_db}?sslmode=disable&pool_max_conns=50"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-RedisP@ss_Prod2026!}@redis:6379/0"
      SESSION_SECRET: ${SESSION_SECRET:-Generate64ByteSecureSecretStringForProductionCrypto!}
      CORS_ALLOWED_ORIGINS: "${APP_URL:-https://erp.example.sa},http://localhost:3000"
      TZ: Asia/Riyadh
    depends_on:
      erp-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - erp-internal

  # 5. Background Asynchronous Worker
  erp-worker:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.worker
    container_name: erp-worker
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: "postgres://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-ChangeMeInProduction_StrongP@ss2026!}@postgres:5432/${POSTGRES_DB:-erp_db}?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-RedisP@ss_Prod2026!}@redis:6379/0"
      TZ: Asia/Riyadh
    depends_on:
      erp-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - erp-internal

  # 6. Next.js Web Frontend
  erp-web:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.web
    container_name: erp-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - erp-api
    networks:
      - erp-internal

  # 7. Production Reverse Proxy (Nginx)
  nginx:
    image: nginx:1.27-alpine
    container_name: erp-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - erp-web
      - erp-api
    networks:
      - erp-internal
      - erp-public

networks:
  erp-internal:
    driver: bridge
  erp-public:
    driver: bridge

volumes:
  pgdata:
    name: erp-pgdata
  pgbackups:
    name: erp-pgbackups
  redisdata:
    name: erp-redisdata
