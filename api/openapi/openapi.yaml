components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: erp_session
    MetricsBearer:
      type: http
      scheme: bearer
  parameters:
    LegalEntityQuery:
      name: legal_entity_id
      in: query
      required: false
      description: Legal-entity scope. If also supplied in the header or body, every value must match.
      schema:
        type: string
        format: uuid
    LegalEntityHeader:
      name: X-Legal-Entity-ID
      in: header
      required: false
      description: Optional legal-entity boundary for tenant-scoped authorization.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request or conflicting tenant scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is required or the session has expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated user lacks permission in the requested scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found, including resources hidden by tenant isolation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Request rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    GenericRequest:
      type: object
      additionalProperties: true
    GenericResponse:
      type: object
      additionalProperties: true
    MultipartUploadRequest:
      type: object
      required: [legal_entity_id, file]
      properties:
        legal_entity_id:
          type: string
          format: uuid
        file:
          type: string
          format: binary
        title:
          type: string
        category:
          type: string
        folder_path:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
    accounting_CreateAccountRequest:
      type: object
      required:
        - chart_id
        - code
        - name_en
        - name_ar
        - account_type
        - normal_balance
        - allow_posting
        - is_control_account
      properties:
        chart_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
        code:
          type: string
        name_en:
          type: string
        name_ar:
          type: string
        account_type:
          type: string
        normal_balance:
          type: object
          additionalProperties: true
        allow_posting:
          type: boolean
        is_control_account:
          type: boolean
    accounting_CreateJournalEntryRequest:
      type: object
      required:
        - journal_id
        - description
        - lines
      properties:
        journal_id:
          type: string
          format: uuid
        fiscal_period_id:
          type: string
          format: uuid
        entry_number:
          type: string
        accounting_date:
          type: string
          format: date-time
        reference:
          type: string
        description:
          type: string
        currency_code:
          type: string
        exchange_rate:
          type: number
          format: decimal
        lines:
          type: array
          items:
            $ref: '#/components/schemas/accounting_CreateJournalLineRequest'
    accounting_CreateJournalLineRequest:
      type: object
      required:
        - account_id
        - transaction_debit
        - transaction_credit
      properties:
        account_id:
          type: string
          format: uuid
        description:
          type: string
        currency_code:
          type: string
        exchange_rate:
          type: number
          format: decimal
        transaction_debit:
          type: number
          format: decimal
        transaction_credit:
          type: number
          format: decimal
        branch_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        cost_center_id:
          type: string
          format: uuid
