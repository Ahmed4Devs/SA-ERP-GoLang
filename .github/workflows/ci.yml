name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: erp_test_password
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_test -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://erp_test:erp_test_password@127.0.0.1:5432/erp_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - name: Verify generated OpenAPI contract
        run: |
          go run ./cmd/openapi-gen
          git diff --exit-code -- api/openapi/openapi.yaml
      - name: Unit tests with race detector
        run: go test -race -count=1 ./internal/...
      # The test database helper serializes packages with a PostgreSQL advisory
      # lock and rebuilds all application schemas before each package.
      - name: Integration tests and coverage gate
        run: |
          go test -race -p 1 -count=1 -timeout 30m -coverpkg=./internal/... -coverprofile=coverage.out ./tests/...
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          echo "Integration coverage: ${coverage}%"
          awk -v coverage="${coverage}" 'BEGIN { if (coverage + 0 < 45) exit 1 }'
      - name: Reachable Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Verify production database role boundaries
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: erp_test
          PGPASSWORD: erp_test_password
          PGDATABASE: erp_runtime_roles_test
          ERP_MIGRATOR_PASSWORD: ci-only-migration-password
          ERP_APP_PASSWORD: ci-only-application-password
          ERP_BACKUP_PASSWORD: ci-only-backup-password
          MIGRATION_DATABASE_URL: postgres://erp_migrator:ci-only-migration-password@127.0.0.1:5432/erp_runtime_roles_test?sslmode=disable
        run: |
          createdb "$PGDATABASE"
          psql --no-psqlrc --file=deployments/postgres/provision-roles.sql
          go run ./cmd/erp-migrate up
          PGUSER=erp_migrator PGPASSWORD="$ERP_MIGRATOR_PASSWORD" psql --no-psqlrc --file=deployments/postgres/grant-runtime.sql
          PGUSER=erp_app PGPASSWORD="$ERP_APP_PASSWORD" psql --no-psqlrc --file=tests/operations/database_roles.sql

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: erp_web
          POSTGRES_PASSWORD: erp_web_password
          POSTGRES_DB: erp_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_web -d erp_web"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Migrate browser-test database
        working-directory: .
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.28.0 -dir database/migrations postgres "postgres://erp_web:erp_web_password@127.0.0.1:5432/erp_web?sslmode=disable" up
      - name: Start real API for browser contract test
        working-directory: .
        env:
          APP_ENV: development
          DATABASE_URL: postgres://erp_web:erp_web_password@127.0.0.1:5432/erp_web?sslmode=disable
          BOOTSTRAP_ADMIN_ENABLED: "true"
          BOOTSTRAP_DEMO_DATA_ENABLED: "true"
          STORAGE_LOCAL_DIR: /tmp/erp-web-e2e-storage
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:3100
          MAIL_DRIVER: mock
          ZATCA_ENVIRONMENT: simulation
        run: |
          nohup go run ./cmd/erp-api >/tmp/erp-api.log 2>&1 &
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/erp-api.log
          exit 1
      - name: Run browser flow against Go API and PostgreSQL
        env:
          E2E_REAL_BACKEND: "1"
          E2E_USERNAME: admin
          E2E_PASSWORD: Admin@ERP123!
        run: npx playwright test e2e/real-backend.spec.ts e2e/sales-invoices-real.spec.ts
      - run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validate development Compose
        run: docker compose config --quiet
      - name: Validate production Compose
        env:
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: ci-only-strong-database-password
          POSTGRES_DB: erp_db
          ERP_MIGRATOR_PASSWORD: ci-only-migration-password
          ERP_APP_PASSWORD: ci-only-application-password
          ERP_BACKUP_PASSWORD: ci-only-backup-password
          MIGRATION_DATABASE_URL: postgres://erp_migrator:ci-only-migration-password@postgres:5432/erp_db?sslmode=disable
          DATABASE_URL: postgres://erp_app:ci-only-application-password@postgres:5432/erp_db?sslmode=disable
          APP_URL: https://erp.example.test
          TLS_CERT_PATH: /tmp/ci-cert.pem
          TLS_KEY_PATH: /tmp/ci-key.pem
          MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          METRICS_BEARER_TOKEN: ci-only-metrics-token-at-least-32-characters
          BACKUP_ENCRYPTION_KEY: ci-only-backup-encryption-key-at-least-32-characters
          SMTP_HOST: smtp.example.test
          SMTP_USERNAME: ci-user
          SMTP_PASSWORD: ci-only-smtp-password
          SMTP_FROM: no-reply@example.test
        run: docker compose -f deployments/compose/docker-compose.prod.yml config --quiet
      - name: Build deployable images
        run: |
          docker build -f deployments/docker/Dockerfile.postgres -t erp-postgres:ci .
          docker build -f deployments/docker/Dockerfile.api -t erp-api:ci .
          docker build -f deployments/docker/Dockerfile.worker -t erp-worker:ci .
          docker build -f deployments/docker/Dockerfile.migrate -t erp-migrate:ci .
          docker build -f deployments/docker/Dockerfile.backup -t erp-backup:ci .
          docker build -f deployments/docker/Dockerfile.web -t erp-web:ci .
          docker build -f deployments/docker/Dockerfile.nginx -t erp-nginx:ci .
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: erp-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: erp-worker:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan migration image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: erp-migrate:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: erp-web:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan backup image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: erp-backup:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan PostgreSQL runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: erp-postgres:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan Nginx runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: erp-nginx:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate API image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: erp-api:ci
          artifact-name: erp-api.spdx.json
      - name: Generate web image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: erp-web:ci
          artifact-name: erp-web.spdx.json
      - name: Generate worker image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: erp-worker:ci
          artifact-name: erp-worker.spdx.json
      - name: Generate migration image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: erp-migrate:ci
          artifact-name: erp-migrate.spdx.json
      - name: Generate backup image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: erp-backup:ci
          artifact-name: erp-backup.spdx.json
      - name: Generate PostgreSQL image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: erp-postgres:ci
          artifact-name: erp-postgres.spdx.json
      - name: Generate Nginx image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: erp-nginx:ci
          artifact-name: erp-nginx.spdx.json

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Scan repository dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          trivyignores: .trivyignore.yaml
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  backup-restore-drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: erp_backup
          POSTGRES_PASSWORD: erp_backup_password
          POSTGRES_DB: erp_backup_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_backup -d erp_backup_drill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: erp_backup
      POSTGRES_PASSWORD: erp_backup_password
      POSTGRES_DB: erp_backup_drill
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: erp_backup
      PGPASSWORD: erp_backup_password
      PGDATABASE: erp_backup_drill
      BACKUP_ENCRYPTION_KEY: ci-backup-drill-encryption-key
      BACKUP_QUIESCED: "true"
      RESTORE_QUIESCED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify recovery bundle integrity defenses
        run: python3 -m unittest discover -s scripts -p test_backup_bundle.py -v
      - name: Build recovery image
        run: docker build -f deployments/docker/Dockerfile.backup -t erp-backup:drill .
      - name: Seed isolated database and attachment markers
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "${POSTGRES_CONTAINER}" psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE backup_drill_marker (id integer PRIMARY KEY, value text NOT NULL); INSERT INTO backup_drill_marker VALUES (1, 'verified');"
          mkdir -p "${RUNNER_TEMP}/backups" "${RUNNER_TEMP}/documents" "${RUNNER_TEMP}/restored-documents"
          printf 'verified document\n' > "${RUNNER_TEMP}/documents/invoice.txt"
          chmod 777 "${RUNNER_TEMP}/backups" "${RUNNER_TEMP}/restored-documents"
      - name: Back up and restore encrypted database and attachments
        run: |
          docker run --rm --network host -e POSTGRES_HOST -e POSTGRES_PORT -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB \
            -e BACKUP_ENCRYPTION_KEY -e BACKUP_QUIESCED \
            -v "${RUNNER_TEMP}/backups:/backups" -v "${RUNNER_TEMP}/documents:/app/data/storage:ro" erp-backup:drill
          backup_file="$(find "${RUNNER_TEMP}/backups" -name '*.tar.gz.enc' -type f -print -quit)"
          test -n "${backup_file}"
          docker run --rm --network host -e POSTGRES_HOST -e POSTGRES_PORT -e POSTGRES_USER -e POSTGRES_PASSWORD \
            -e POSTGRES_DB=erp_restored_drill -e BACKUP_ENCRYPTION_KEY -e RESTORE_QUIESCED -e STORAGE_LOCAL_DIR=/restored \
            -v "${RUNNER_TEMP}/backups:/backups:ro" -v "${RUNNER_TEMP}/restored-documents:/restored" \
            --entrypoint /usr/local/bin/restore.sh erp-backup:drill "/backups/$(basename "${backup_file}")" --force
          cmp "${RUNNER_TEMP}/documents/invoice.txt" "${RUNNER_TEMP}/restored-documents/invoice.txt"
      - name: Verify restored database marker
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: test "$(docker exec "${POSTGRES_CONTAINER}" psql -U "${POSTGRES_USER}" -d erp_restored_drill -Atqc 'SELECT value FROM backup_drill_marker WHERE id = 1')" = "verified"
