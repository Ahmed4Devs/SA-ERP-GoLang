name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.2-alpine
        env:
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: erp_test_password
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_test -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://erp_test:erp_test_password@127.0.0.1:5432/erp_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - name: Verify generated OpenAPI contract
        run: |
          go run ./cmd/openapi-gen
          git diff --exit-code -- api/openapi/openapi.yaml
      - run: go test -count=1 ./internal/...
      # Integration packages share the same database and schema. Keep package
      # execution serial so fixtures cannot exhaust connections or collide.
      - run: go test -p 1 -count=1 -timeout 15m ./tests/...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development Compose
        run: docker compose config --quiet
      - name: Validate production Compose
        env:
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: ci-only-strong-database-password
          POSTGRES_DB: erp_db
          DATABASE_URL: postgres://erp_user:ci-only-strong-database-password@postgres:5432/erp_db?sslmode=disable
          APP_URL: https://erp.example.test
          TLS_CERT_PATH: /tmp/ci-cert.pem
          TLS_KEY_PATH: /tmp/ci-key.pem
          MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          METRICS_BEARER_TOKEN: ci-only-metrics-token-at-least-32-characters
          SMTP_HOST: smtp.example.test
          SMTP_USERNAME: ci-user
          SMTP_PASSWORD: ci-only-smtp-password
          SMTP_FROM: no-reply@example.test
        run: docker compose -f deployments/compose/docker-compose.prod.yml config --quiet
      - name: Build deployable images
        run: |
          docker build -f deployments/docker/Dockerfile.api -t erp-api:ci .
          docker build -f deployments/docker/Dockerfile.worker -t erp-worker:ci .
          docker build -f deployments/docker/Dockerfile.migrate -t erp-migrate:ci .
          docker build -f deployments/docker/Dockerfile.web -t erp-web:ci .
